version: '3.8'

# docker-compose.yml — DotVector gRPC server 编排（M9）
# 构建并启动：docker compose up --build

services:
  dotvector:
    image: ghcr.io/iotsharp/dotvector:latest
    build:
      context: .
      dockerfile: src/DotVector/Dockerfile
    ports:
      - "5180:5180"   # gRPC
    volumes:
      - dotvector-data:/data
    environment:
      - DOTVECTOR_DATA_DIR=/data
      - DOTVECTOR_PORT=5180
    restart: unless-stopped

volumes:
  dotvector-data:
